name: gates

# Every gate the fork enforces, on every push and PR. The list of gates lives
# in scripts/ci_gates.sh -- the same script the pre-push hook and the daily
# upstream sync run -- so this file only provides a runner and the shared
# gate checkout.
#
# Upstream's own workflows (build_check.yml on PRs, build_push*.yml on the
# release/preview branches) are left untouched so the daily rebase never
# conflicts on them.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: file-length, md-naming, binaries, gradle check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The shell gates and their exemption tables live in the shared utils
      # repo so every repo enforces the same rules. Checking it out beats
      # vendoring a copy, which is exactly how a gate and a survey start
      # disagreeing.
      - name: Check out the shared gates
        uses: actions/checkout@v7
        with:
          repository: kuhyx/utils
          path: .utils

      - uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v5

      # setup-gradle caches ~/.gradle only; Robolectric fetches android-all
      # (~100 MB per SDK) into ~/.m2 on first use. Its contents never change
      # for a given SDK, so the key is the SDK pinned in robolectric.properties.
      - name: Cache the Robolectric android-all jars
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-android-all-${{ hashFiles('**/robolectric.properties') }}

      - name: Run every gate
        env:
          UTILS_ROOT: ${{ github.workspace }}/.utils
        run: bash scripts/ci_gates.sh
