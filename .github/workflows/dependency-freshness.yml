name: dependency freshness

# Every dependency on its ecosystem's newest STABLE release, enforced on push
# as well as at commit time. The local pre-commit hook only sees the manifests
# in a commit and can be skipped entirely by a fresh clone that never ran
# `scripts/install_hooks.sh`; this runs `--all` over the whole repo.
#
# `gates` runs the same check inside scripts/ci_gates.sh; this workflow is
# the fleet-wide canonical name every kuhy repo carries, and it answers in
# seconds where `gates` needs a full Gradle build first.
#
# Expect this to go red for reasons this repo's commit did not cause: an
# upstream release overnight is enough. That is the chosen behaviour -- the
# alternative is a gate that only notices staleness when someone remembers to
# look.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-freshness:
    name: dependencies on newest stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The gate lives in the shared utils repo so every repo resolves the
      # same "latest stable" the same way.
      - name: Check out the shared gate
        uses: actions/checkout@v7
        with:
          repository: kuhyx/utils
          path: .utils

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install the gate's two runtime dependencies
        run: python -m pip install --upgrade pyyaml packaging

      - name: Cache registry lookups
        uses: actions/cache@v5
        with:
          path: ~/.cache/dep-freshness
          key: dep-freshness-${{ hashFiles('**/*.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: dep-freshness-

      - name: Every dependency is on newest stable
        env:
          UTILS_ROOT: ${{ github.workspace }}/.utils
        run: bash scripts/check_dependency_freshness.sh --all --strict
