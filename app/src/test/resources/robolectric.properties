# compileSdk is 37, which Robolectric only sandboxes on Java 21; CI and the
# local gate run Java 17, so tests execute against the newest SDK Java 17 can (35; 36+ need 21).
sdk=35
# The manifest names eu.kanade.tachiyomi.App, which boots Koin/Injekt, the image loader
# and the workers; a sandbox gets a bare Application instead and App has its own tests.
application=android.app.Application
