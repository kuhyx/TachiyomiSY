# Pre-commit configuration for the kuhy TachiyomiSY fork.
#
# Install:  scripts/install_hooks.sh
# Run:      pre-commit run --all-files
#
# Only NON-MUTATING checks belong here. This tree is rebased onto upstream
# daily; a hook that rewrites tracked files (whitespace fixers, formatters)
# would edit upstream's files and turn every sync into a conflict.

default_stages: [pre-commit]
fail_fast: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        # Follow `source` lines so the sourced helper is checked, not reported.
        args: [-x]

  - repo: local
    hooks:
      # All four gates are thin delegates to ~/src/utils, which owns the rules
      # so that one repo's idea of "too long", "badly named" or "binary"
      # cannot drift from every other repo's.
      - id: no-binaries
        name: no binary / image files
        entry: scripts/check_no_binaries.sh
        language: system

      - id: file-length
        name: file length <= 250 lines
        entry: scripts/check_file_length.sh
        language: system

      - id: md-naming
        name: markdown naming convention
        entry: scripts/check_md_naming.sh
        language: system
        files: \.(md|markdown)$

      # Every dependency on its ecosystem's newest STABLE release, exact-pinned
      # so the question is mechanically answerable at all.
      #
      # `files:` is what keeps this cheap: a commit touching only source makes
      # ZERO network requests, and manifest commits mostly hit a 6h disk cache.
      #
      # Runs WITHOUT --strict on purpose. Offline it degrades to the cached
      # answer and passes with a loud banner; `--no-verify` is banned here, so
      # a hook that hard-failed on a flaky connection would leave no way to
      # commit at all. CI, always online, is the strict authority.
      - id: dependency-freshness
        name: dependencies on newest stable
        entry: scripts/check_dependency_freshness.sh
        language: system
        pass_filenames: true
        files: >-
          (pubspec\.(yaml|lock)|pyproject\.toml|requirements.*\.txt|uv\.lock
          |package\.json|package-lock\.json|pnpm-lock\.yaml
          |Cargo\.(toml|lock)|go\.(mod|sum)
          |\.fvmrc|\.nvmrc|\.python-version
          |\.versions\.toml|gradle-wrapper\.properties
          |\.github/workflows/.*\.ya?ml)$

      # The same gates CI runs, before the push that would trigger CI. The
      # Gradle half runs under capped.sh locally and takes well over ten
      # minutes, so it only runs when the pushed range touches build inputs
      # (Kotlin, Gradle, resources); a docs-only push pays seconds.
      - id: ci-gates
        name: CI gates (file-length, md-naming, binaries, gradle when needed)
        entry: bash scripts/ci_gates.sh --changed-only
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [pre-push]
