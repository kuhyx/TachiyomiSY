android.nonTransitiveRClass=false

kotlin.code.style=official

# Configuration should be synced with [/gradle/build-logic/gradle.properties]
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true

# Configuration cache: the 15-module configuration phase drops from ~10 s to
# ~2 s on every gate run (measured 2026-09-18, zero problems reported).
org.gradle.configuration-cache=true
